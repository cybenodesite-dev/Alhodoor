<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة ولي الأمر - منصة الحضور</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5 QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-lg sticky top-0 z-50 text-center">
        <h1 class="text-xl font-black tracking-wide">منصة الحضور</h1>
        <p class="text-xs text-indigo-200 mt-0.5">alhodoor.site • نظام متابعة ولي الأمر</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- رفع الـ QR -->
        <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 text-center">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-qrcode text-xl"></i>
            </div>
            <h2 class="text-base font-bold text-slate-800">مسح / رفع كود QR الطالب</h2>
            <p class="text-xs text-slate-500 mt-1 mb-4">ارفع صورة الـ QR للوصول الفوري للتقرير الكامل</p>

            <input type="file" id="qr-input" accept="image/*" class="hidden" onchange="scanQRFromFile(event)">

            <button onclick="document.getElementById('qr-input').click()" class="w-full bg-indigo-600 active:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-sm text-sm">
                <i class="fa-solid fa-upload"></i>
                <span>رفع صورة الـ QR</span>
            </button>

            <!-- الرسائل والحالة -->
            <div id="status-message" class="hidden mt-3 p-3 rounded-xl text-xs font-medium"></div>
            <div id="reader" class="hidden mt-2"></div>
        </section>

        <!-- كارت إحصائيات الطالب -->
        <section id="student-card" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 hidden space-y-4">
            
            <!-- البيانات الأساسية -->
            <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
                <div class="w-12 h-12 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-inner" id="student-avatar">
                    ط
                </div>
                <div>
                    <h3 id="student-name" class="font-bold text-slate-800 text-base">---</h3>
                    <p class="text-xs text-slate-500 mt-0.5">الصف: <span id="student-grade" class="font-semibold text-slate-700">---</span></p>
                    <p class="text-xs text-slate-500">المدرس: <span id="teacher-name" class="font-semibold text-indigo-600">---</span></p>
                </div>
            </div>

            <!-- شبكة الإحصائيات -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-emerald-50/80 border border-emerald-100 p-3 rounded-xl">
                    <span class="block text-xs font-semibold text-emerald-700 mb-1"><i class="fa-solid fa-wallet ml-1"></i> المدفوعات</span>
                    <strong id="stat-payments" class="text-base font-bold text-emerald-900">0 ج.م</strong>
                </div>

                <div class="bg-rose-50/80 border border-rose-100 p-3 rounded-xl">
                    <span class="block text-xs font-semibold text-rose-700 mb-1"><i class="fa-solid fa-circle-exclamation ml-1"></i> المتأخرات</span>
                    <strong id="stat-due" class="text-base font-bold text-rose-900">0 ج.م</strong>
                </div>

                <div class="bg-amber-50/80 border border-amber-100 p-3 rounded-xl">
                    <span class="block text-xs font-semibold text-amber-700 mb-1"><i class="fa-solid fa-user-xmark ml-1"></i> الغياب</span>
                    <strong id="stat-absence" class="text-base font-bold text-amber-900">0 أيام</strong>
                </div>

                <div class="bg-blue-50/80 border border-blue-100 p-3 rounded-xl">
                    <span class="block text-xs font-semibold text-blue-700 mb-1"><i class="fa-solid fa-chart-line ml-1"></i> الاختبارات</span>
                    <strong id="stat-score" class="text-base font-bold text-blue-900">0%</strong>
                </div>
            </div>
        </section>

    </main>

    <!-- Firebase SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collectionGroup, getDocs, doc, getDoc, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdKoZ_EHdA_josjJYVl_4aqLarSoNL808",
            authDomain: "studio-6098024039-4334b.firebaseapp.com",
            databaseURL: "https://studio-6098024039-4334b-default-rtdb.firebaseio.com",
            projectId: "studio-6098024039-4334b",
            storageBucket: "studio-6098024039-4334b.firebasestorage.app",
            messagingSenderId: "24940764496",
            appId: "1:24940764496:web:0210613fa4316d7e10e055",
            measurementId: "G-Q637RJWPYP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.fetchStudentData = async function(studentId) {
            const statusMsg = document.getElementById('status-message');
            statusMsg.className = "mt-3 p-3 rounded-xl text-xs font-medium bg-blue-50 text-blue-600 block";
            statusMsg.innerText = "جاري البحث عن بيانات الطالب والإحصائيات...";

            try {
                // 1. البحث الشامل في المجموعات الفرعية عن الطالب
                const studentsSnap = await getDocs(collectionGroup(db, 'students'));
                let studentDoc = null;
                let teacherId = "";

                studentsSnap.forEach(docSnap => {
                    if (docSnap.id === studentId) {
                        studentDoc = docSnap.data();
                        const pathSegments = docSnap.ref.path.split('/');
                        // المسار بيكون: users / {teacherId} / students / {studentId}
                        teacherId = pathSegments[1];
                    }
                });

                if (!studentDoc) {
                    throw new Error("لم يتم العثور على بيانات الطالب. تأكد من كود الـ QR.");
                }

                // 2. جلب اسم المدرس
                let teacherName = "غير محدد";
                if (teacherId) {
                    const teacherSnap = await getDoc(doc(db, "users", teacherId));
                    if (teacherSnap.exists()) {
                        const tData = teacherSnap.data();
                        teacherName = tData.displayName || tData.name || tData.fullName || "المدرس المسجل";
                    }
                }

                // عرض الاسم والصف
                const name = studentDoc.name || studentDoc.studentName || studentDoc.fullName || "بدون اسم";
                document.getElementById('student-name').innerText = name;
                document.getElementById('student-grade').innerText = studentDoc.grade || studentDoc.class || studentDoc.gradeName || "غير محدد";
                document.getElementById('teacher-name').innerText = teacherName;
                document.getElementById('student-avatar').innerText = name[0] || "ط";

                // 3. جلب بيانات الفرعيات بالطريقتين (Direct Path + CollectionGroup) لضمان القراءة
                let absences = 0, paid = 0, due = 0, examAvg = 0;

                if (teacherId) {
                    // أ) الحضور والغياب
                    const attSnap = await getDocs(collection(db, `users/${teacherId}/students/${studentId}/attendance`));
                    attSnap.forEach(d => {
                        const val = d.data();
                        if (val.status === 'absent' || val.type === 'absent' || val.state === 'غائب' || val.absent === true) {
                            absences++;
                        }
                    });

                    // ب) المدفوعات ومتأخراتها
                    const paySnap = await getDocs(collection(db, `users/${teacherId}/students/${studentId}/payments`));
                    paySnap.forEach(d => {
                        const val = d.data();
                        paid += Number(val.amountPaid || val.paid || val.amount || val.paidAmount || 0);
                        due += Number(val.amountDue || val.due || val.remaining || val.lateAmount || 0);
                    });

                    // ج) الامتحانات
                    const examSnap = await getDocs(collection(db, `users/${teacherId}/students/${studentId}/exams`));
                    let totalScore = 0, totalMax = 0, count = 0;
                    examSnap.forEach(d => {
                        const val = d.data();
                        const score = val.score !== undefined ? val.score : (val.degree !== undefined ? val.degree : val.mark);
                        const max = val.totalScore || val.maxScore || 100;
                        if (score !== undefined) {
                            totalScore += Number(score);
                            totalMax += Number(max);
                            count++;
                        }
                    });

                    if (count > 0) {
                        examAvg = Math.round((totalScore / (count * 100)) * 100); // حساب النسبة المئوية
                        if (isNaN(examAvg) || examAvg > 100) {
                            examAvg = Math.round(totalScore / count);
                        }
                    }
                }

                // إظهار الأرقام النهائية
                document.getElementById('stat-payments').innerText = paid + " ج.م";
                document.getElementById('stat-due').innerText = due + " ج.م";
                document.getElementById('stat-absence').innerText = absences + " أيام";
                document.getElementById('stat-score').innerText = examAvg + "%";

                statusMsg.className = "hidden";
                document.getElementById('student-card').classList.remove('hidden');

            } catch (err) {
                statusMsg.className = "mt-3 p-3 rounded-xl text-xs font-medium bg-red-50 text-red-600 block";
                statusMsg.innerText = err.message || "حدث خطأ أثناء تحميل بيانات الطالب.";
            }
        };
    </script>

    <script>
        function scanQRFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.scanFile(file, true)
                .then(decodedText => {
                    const cleanedCode = decodedText.trim();
                    window.fetchStudentData(cleanedCode);
                })
                .catch(() => {
                    alert("تعذر قراءة الـ QR من هذه الصورة. جرب اختيار صورة أوضح.");
                });
        }
    </script>
</body>
</html>
